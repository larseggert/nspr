name: nspr4 backport check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prs:
        description: Space-separated pull request numbers to check
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  abi:
    name: Check commits for nspr4 ABI compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install abidiff
        run: |
          sudo apt-get update
          sudo apt-get install -y abigail-tools

      # Cherry-picks each commit of each PR onto nspr4 plus the PR's previous commits,
      # builds with debug info, and compares against the previous step with abidiff.
      - name: Check commits against nspr4
        env:
          PRS: ${{ github.event.pull_request.number || inputs.prs }}
        run: |
          base=$(git rev-parse origin/nspr4)

          build_abi() { # <tree-ish> <abi-dir>
            local src=$2/src
            mkdir -p "$src" "$2/lib"
            git archive "$1" | tar -x -C "$src"
            (cd "$src" && NSPR_SKIP_TESTS=1 .github/scripts/build-and-test.sh \
              --enable-optimize --enable-debug-symbols >build.log 2>&1) || {
              tail -20 "$src/build.log" >&2
              return 1
            }
            cp -L "$src"/target/dist/lib/lib*.so "$2/lib/"
            cp -R "$src/target/dist/include/nspr" "$2/include"
          }

          compare_abi() { # <old-abi-dir> <new-abi-dir>
            local lib rc=0
            for lib in "$1"/lib/*.so; do
              abidiff --hd1 "$1/include" --hd2 "$2/include" "$lib" "$2/lib/${lib##*/}" \
                >"$2/abidiff-${lib##*/}.txt" 2>&1 || rc=$((rc | $?))
            done
            # abidiff exit status bits: 1 error, 4 ABI change, 8 incompatible ABI change.
            if ((rc & 1)); then echo error
            elif ((rc & 8)); then echo incompatible
            elif ((rc & 4)); then echo change
            else echo none
            fi
          }

          pick() { # <onto> <commit>: print the tree of cherry-picking <commit> onto <onto>
            git merge-tree --write-tree --merge-base="$2^" "$1" "$2"
          }

          row() {
            printf '%-10s %-6s %-8s %-13s %-12s %s\n' "$@"
          }

          check() { # <range> <workdir>
            local tree=$base prev=$RUNNER_TEMP/abi-base n=0 c short subject alone class stacked next abi
            row COMMIT ALONE STACKED FILES ABI SUBJECT
            while read -r c short subject; do
              n=$((n + 1))
              alone=no
              pick "$base" "$c" >/dev/null && alone=yes

              # Commits touching only CI, tests and docs cannot change the ABI.
              if git diff --quiet "$c^" "$c" -- ':!.github' ':!pr/tests' ':!lib/tests' \
                ':!*.md' ':!README*' ':!.git*' ':!.codecov.yml'; then
                class=no-abi
              elif git diff --quiet "$c^" "$c" -- pr/include 'lib/*.h' '*.def'; then
                class=source
              else
                class=public-header
              fi

              stacked=conflict abi=-
              if next=$(pick "$tree" "$c"); then
                tree=$next stacked=ok abi=none
                if [ "$class" != no-abi ]; then
                  if build_abi "$tree" "$2/$n"; then
                    abi=$(compare_abi "$prev" "$2/$n")
                    prev=$2/$n
                  else
                    abi=build-failed
                  fi
                fi
                # abidiff ignores macros and constants, so public header changes always need review.
                [ "$class" != public-header ] || [ "$abi" != none ] || abi=none+review
              fi
              row "$short" "$alone" "$stacked" "$class" "$abi" "$subject"
            done < <(git log --reverse --no-merges --format='%H %h %s' "$1")

            find "$2" -name 'abidiff-*.txt' -size +0 -exec tail -v -n +1 {} +
          }

          build_abi "$base" "$RUNNER_TEMP/abi-base"

          for n in $PRS; do
            case $n in *[!0-9]*) echo "Skipping invalid PR number $n"; continue ;; esac
            git fetch --no-tags origin "+refs/pull/$n/head:refs/remotes/pr/$n"
            {
              echo "### #$n"
              echo '```'
              check "origin/main..pr/$n" "$RUNNER_TEMP/pr-$n" || echo "Check failed"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
