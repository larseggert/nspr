name: Lint GitHub Actions workflows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    uses: mozilla/actions/.github/workflows/actionlint.yml@4f515786a131dedc8913cf64640f35a144ea4d0f # v2.0.9
    permissions:
      contents: read
      security-events: write # Required for zizmor to upload SARIF results
